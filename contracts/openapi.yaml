openapi: 3.1.0
info:
  title: Cascade Zero API
  version: 1.1.0
  description: Contract-first sandbox incident evaluation API. All demo results are simulated unless explicitly marked otherwise.
security: [{bearerAuth: []}]
servers:
  - url: http://localhost:8000
paths:
  /v1/evaluate:
    post:
      operationId: evaluateProposals
      description: Risk-gated proposal evaluation only. It returns an allowed subset and reasons but never executes actions.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationRequest'}}}}
      responses:
        '200': {description: Evaluation decision, content: {application/json: {schema: {$ref: '#/components/schemas/EvaluationResponse'}}}}
        '400': {description: Invalid request}
        '403': {description: Forbidden}
      security: [{bearerAuth: []}]
  /v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200': {description: Health status, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
  /v1/topology:
    get:
      operationId: getTopology
      responses:
        '200': {description: Service topology, content: {application/json: {schema: {$ref: '#/components/schemas/Topology'}}}}
  /v1/admin/status:
    get:
      operationId: getAdminStatus
      description: Aggregate project status — run counts, AI engine health, scenario action menus.
      responses:
        '200': {description: Status, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
  /v1/runs:
    get:
      operationId: listRuns
      description: Run history, newest first; in-memory, cleared on server restart.
      responses:
        '200': {description: Runs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Run'}}}}}
    post:
      operationId: createRun
      description: Hosted requests require bearer authentication. Loopback development may opt out. At most 8 active runs and 60 starts per minute; the newest 100 runs are retained.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '400': {description: Invalid run request}
        '403': {description: Forbidden}
        '429': {description: Run capacity or rate limit reached}
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
  /v1/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      description: Finite SSE snapshot by default. stream=1 keeps the connection open, sends event IDs and heartbeats, and ends with a named done event. Resume with Last-Event-ID or after. Each data message conforms to events.schema.json.
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Server-sent events, content: {text/event-stream: {schema: {type: string}}}}
  /v1/runs/{run_id}/plans:
    get:
      operationId: listPlans
      parameters: [{name: run_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Candidate plans, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Plan'}}}}}
  /v1/plans/{plan_id}/backtest:
    post:
      operationId: backtestPlan
      description: Replays the recorded prefix and applies the candidate once at its decision tick, over the original horizon; nothing live is touched. Requires operator auth.
      parameters: [{name: plan_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Backtest verdict, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '403': {description: Forbidden}
        '404': {description: Plan not found}
      security: [{bearerAuth: []}]
  /v1/plans/{plan_id}/approval:
    post:
      operationId: decidePlan
      description: Approve for sandbox replay or reject a candidate; requires authenticated operator and idempotency key.
      parameters: [{name: plan_id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [approved], properties: {approved: {type: boolean}, reason: {type: string}}}}}}
      responses:
        '202': {description: Operator decision recorded}
        '403': {description: Forbidden}
        '409': {description: Invalid transition or replay}
      security: [{bearerAuth: []}]
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    RunRequest:
      type: object
      required: [seed, scenario, policy]
      properties:
        seed: {type: integer, minimum: 0, maximum: 9007199254740991}
        scenario: {type: string, enum: [db_slowdown, payments_degradation, traffic_surge, telemetry_faults]}
        policy: {type: string, enum: [none, independent, guardrails, coordinated, ai_coordinated]}
        purpose: {type: string, enum: [policy_comparison, operator_review], default: policy_comparison}
    Run:
      type: object
      required: [id, seed, scenario, policy, state, simulated]
      properties:
        id: {type: string}
        seed: {type: integer}
        scenario: {type: string, enum: [db_slowdown, payments_degradation, traffic_surge, telemetry_faults]}
        policy: {type: string}
        state: {type: string, enum: [created, running, completed, failed, cancelled]}
        simulated: {type: boolean}
        purpose: {type: string, enum: [policy_comparison, operator_review]}
        created_at: {type: string}
        event_count: {type: integer}
        plan_count: {type: integer}
        metrics: {type: object, additionalProperties: {type: number}}
        runtime:
          type: object
          required: [decision_latency_p50_ms, decision_latency_p95_ms, decision_latency_samples, source]
          properties:
            decision_latency_p50_ms: {type: number, minimum: 0}
            decision_latency_p95_ms: {type: number, minimum: 0}
            decision_latency_samples: {type: integer, minimum: 1}
            source: {type: string, enum: [local_process_wall_clock]}
    EvaluationRequest:
      type: object
      additionalProperties: false
      required: [scenario, state, proposals]
      properties:
        scenario: {type: string, enum: [db_slowdown, payments_degradation, traffic_surge, telemetry_faults]}
        state:
          type: object
          additionalProperties: false
          required: [error_rate, latency, queue_depth, db_load]
          properties:
            tick: {type: integer, minimum: 0, maximum: 1000000}
            error_rate: {type: number, minimum: 0, maximum: 1}
            latency: {type: number, minimum: 0, maximum: 1000000}
            queue_depth: {type: integer, minimum: 0, maximum: 1000000}
            db_load: {type: number, minimum: 0, maximum: 1}
            service_queues: {type: object, additionalProperties: {type: integer, minimum: 0, maximum: 1000000}}
            telemetry_age_ticks: {type: integer, minimum: 0, maximum: 100}
            telemetry_dropped: {type: boolean}
        proposals:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [agent_id, action, target, expected_effect, cost, confidence, ttl]
            properties:
              agent_id: {type: string, enum: [retry-agent, scale-agent, restart-agent]}
              action: {type: string, enum: [increase_retries, add_replicas, restart_service]}
              target: {type: string, enum: [database, orders, payments]}
              expected_effect: {type: string, minLength: 1, maxLength: 160}
              cost: {type: string, minLength: 1, maxLength: 120}
              confidence: {type: number, minimum: 0, maximum: 1}
              ttl: {type: integer, minimum: 1, maximum: 120}
    EvaluationResponse:
      type: object
      required: [decision, allowed_actions, blocked_actions, predicted_risk, reasons, simulated, measured, external_execution]
      properties:
        decision: {type: string, enum: [allow, hold]}
        allowed_actions: {type: array, items: {type: string}}
        blocked_actions: {type: array, items: {type: object, required: [action, reason], properties: {action: {type: string}, reason: {type: string}}}}
        predicted_risk: {type: [number, 'null'], minimum: 0, maximum: 1}
        reasons: {type: array, items: {type: string}}
        simulated: {type: boolean, const: true}
        measured: {type: boolean, const: false}
        external_execution: {type: boolean, const: false}
    Topology:
      type: object
      required: [nodes, edges]
      properties:
        nodes: {type: array, items: {type: object, required: [id, capacity], properties: {id: {type: string}, capacity: {type: number}}}}
        edges: {type: array, items: {type: object, required: [from, to], properties: {from: {type: string}, to: {type: string}}}}
    Plan:
      type: object
      required: [id, run_id, actions, predicted_risk, status, simulated]
      properties:
        id: {type: string}
        run_id: {type: string}
        actions: {type: array, items: {type: string}}
        predicted_risk: {type: number, minimum: 0, maximum: 1}
        status: {type: string, enum: [candidate, rejected, approved, delayed, executed, superseded]}
        simulated: {type: boolean}
        reasons: {type: array, items: {type: string}}
        ai: {type: object, description: AI-loop provenance (diagnosis, model, probes, checks, fallback); present on ai_coordinated plans., additionalProperties: true}
