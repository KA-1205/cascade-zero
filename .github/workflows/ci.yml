name: Cascade Zero checks
on: [push, pull_request]
jobs:
  contract-and-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: JSON contract and fixture validation
        run: python -m json.tool contracts/events.schema.json >/dev/null && python -m json.tool frontend/mock-data.json >/dev/null
      - name: Compile backend and smoke-test the simulator
        run: python -m compileall -q backend && python -m backend.simulator --seed 42 --policy all
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 jsonschema==4.26.0 pyyaml==6.0.3
      - name: Run full test suite
        run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/app/package-lock.json}
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: frontend/app
      - run: npm run lint && npx tsc --noEmit && npm run build
        working-directory: frontend/app
      - run: npx playwright install --with-deps chromium
        working-directory: frontend/app
      - run: npm run test:e2e
        working-directory: frontend/app
